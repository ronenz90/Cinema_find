name: Check Cinema City showtimes

on:
  schedule:
    # Every 3 hours. GitHub may delay this by a few minutes at busy times,
    # and GitHub disables schedules on repos with no activity for 60 days
    # (a manual "Run workflow" click re-enables it).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Run showtime check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
        run: python scraper/cinema_watcher.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state (if changed)
        run: |
          git config user.name "cinema-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "Update showtime state [skip ci]"
          git push
